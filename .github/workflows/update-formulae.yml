name: Update formulae

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to update
        type: choice
        options: [all, jrs]
        default: all
      version:
        description: Version to pin (e.g. 0.14.7); empty for the latest release
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-formulae

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Homebrew/actions/setup-homebrew@main

      - name: Update formulae
        env:
          GH_TOKEN: ${{ github.token }}
          FORMULA: ${{ inputs.formula }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/update-formulae.sh "$FORMULA" "$VERSION"

      # setup-homebrew drops the credentials actions/checkout persisted, so
      # authenticate the push explicitly.
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"
